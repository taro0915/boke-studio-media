name: publish
# 日本時間 7:30 / 11:30 / 18:00 / 21:00（GitHubの時刻はUTC）
on:
  schedule:
    - cron: "30 22 * * *"
    - cron: "30 2 * * *"
    - cron: "0 9 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "投稿せずにテストだけ"
        type: boolean
        default: true
concurrency:
  group: boke-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python studio/publish_cloud.py ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
      - name: save state
        if: always()
        run: |
          git config user.name "boke-studio-bot"
          git config user.email "boke-studio-bot@users.noreply.github.com"
          git add studio/posted.json
          git diff --cached --quiet || (git commit -m "posted.json update" && git pull --rebase && git push)
