name: check
# 読むだけの状態確認（captionthis.daily の数字）
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: pip install requests
      - env:
          IG_ACCESS_TOKEN: ${{ secrets.IG2_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG2_USER_ID }}
        run: python studio/ig2_check.py
