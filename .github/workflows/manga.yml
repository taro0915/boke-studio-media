name: manga
# Cloudflare の時計から起動: 日本時間 10:17 に1話作成(gen)、1:17 に投稿(publish)
on:
  workflow_dispatch:
    inputs:
      job:
        description: "gen / publish / publish-dry"
        type: string
        default: "gen"
concurrency:
  group: boke-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  manga:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: gen
        if: inputs.job == 'gen'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python studio/manga/manga_daily.py
      - name: publish
        if: inputs.job == 'publish' || inputs.job == 'publish-dry'
        env:
          IG2_ACCESS_TOKEN: ${{ secrets.IG2_ACCESS_TOKEN }}
          IG2_USER_ID: ${{ secrets.IG2_USER_ID }}
        run: python studio/manga/publish_manga.py ${{ inputs.job == 'publish-dry' && '--dry-run' || '' }}
      - name: save
        if: always()
        run: |
          git config user.name "boke-studio-bot"
          git config user.email "boke-studio-bot@users.noreply.github.com"
          git add studio/manga
          git diff --cached --quiet || (git commit -m "manga ${{ inputs.job }}" && git pull --rebase && git push)
