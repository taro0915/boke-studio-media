name: reply
# 1時間おきにコメントへ自動返信（日本時間で毎時17分ごろ）。omoshiroibokete（日本語）と captionthis.daily（英語）
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      send:
        description: "実際に返信する"
        type: boolean
        default: false
      en_force:
        description: "英語版(captionthis.daily)を時刻に関係なく1本作って投稿する"
        type: boolean
        default: false
concurrency:
  group: boke-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: reply (ja, omoshiroibokete)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPLY_LANG: ja
        run: python studio/auto_reply_cloud.py ${{ (github.event_name == 'schedule' || inputs.send) && '--send' || '' }}
      - name: reply (en, captionthis.daily)
        if: always()
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG2_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG2_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPLY_LANG: en
        run: python studio/auto_reply_cloud.py ${{ (github.event_name == 'schedule' || inputs.send) && '--send' || '' }}
      - name: save state
        if: always()
        run: |
          git config user.name "boke-studio-bot"
          git config user.email "boke-studio-bot@users.noreply.github.com"
          git add studio/replied.json 2>/dev/null || true
          git add studio/replied_en.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "replied state update" && git pull --rebase && git push)
      # 英語版 captionthis.daily：日本時間 10時台・22時台・0時台に写真ボケを1本（PC不要）
      - name: en build
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python studio/en_cloud.py build ${{ inputs.en_force && '--force' || '' }}
      - name: en save images
        if: always()
        run: |
          git add studio/posts_en studio/en_state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "en build" && git pull --rebase && git push)
      - name: en publish
        if: always()
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG2_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG2_USER_ID }}
        run: python studio/en_cloud.py publish ${{ inputs.en_force && '--dry-run' || '' }}
      - name: en save state
        if: always()
        run: |
          git add studio/en_state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "en posted" && git pull --rebase && git push)
