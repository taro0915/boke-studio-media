name: reply
# 1時間おきにコメントへ自動返信（日本時間で毎時17分ごろ）。omoshiroibokete（3時間おきに返信）
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      send:
        description: "実際に返信する"
        type: boolean
        default: false
      story_force:
        description: "日本語の話カルーセルを時刻に関係なく1本作る（投稿はテストのみ）"
        type: boolean
        default: false
concurrency:
  group: boke-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow budoux
      - name: reply (ja, omoshiroibokete)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPLY_LANG: ja
        run: python studio/auto_reply_cloud.py ${{ (github.event_name == 'schedule' || inputs.send) && '--send' || '' }}
      - name: save state
        if: always()
        run: |
          git config user.name "boke-studio-bot"
          git config user.email "boke-studio-bot@users.noreply.github.com"
          git add studio/replied.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "replied state update" && git pull --rebase && git push)
      # 日本語の「1枚1文の話」カルーセル：毎日12時台と22時台に1本ずつ（@omoshiroibokete、PC不要）
      - name: story build
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          h=$(TZ=Asia/Tokyo date +%H)
          d=$(TZ=Asia/Tokyo date +%F); morning=no; [ "$h" = "07" ] && [ "$d" \> "2026-12-01" ] && morning=yes
          if [ "$h" = "12" ] || [ "$h" = "22" ] || [ "$morning" = "yes" ] || [ "${{ inputs.story_force }}" = "true" ]; then
            sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
            python studio/story_cloud.py build ${{ inputs.story_force && '--force' || '' }}
          fi
      - name: story save images
        if: always()
        run: |
          git add studio/stories studio/story_state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "story build" && git pull --rebase && git push)
      - name: story publish
        if: always()
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          # テスト（story_force）のときは投稿の下準備も作らない（11/26 Metaに機械的と見られたため）
          if [ "${{ inputs.story_force }}" = "true" ]; then echo "テスト作成のみ。投稿処理はしません"; exit 0; fi
          python studio/story_cloud.py publish
      - name: story save state
        if: always()
        run: |
          git add studio/story_state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "story posted" && git pull --rebase && git push)
